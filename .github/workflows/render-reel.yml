name: Render Olechollos Reel

on:
  workflow_dispatch:
    inputs:
      image_path:
        description: Repository path of the Olechollos story image
        required: true
        type: string
      output_name:
        description: Output MP4 filename
        required: true
        type: string
      duration:
        description: Duration in seconds
        required: true
        default: '7'
        type: string

permissions:
  contents: write

concurrency:
  group: olechollos-reel-${{ inputs.output_name }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate input
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          set -euo pipefail

          case "$IMAGE_PATH" in
            inputs/*.png|inputs/*.jpg|inputs/*.jpeg) ;;
            *)
              echo "Invalid image_path: $IMAGE_PATH"
              exit 1
              ;;
          esac

          test -s "$IMAGE_PATH"

          SAFE_NAME="$(basename "$OUTPUT_NAME")"

          case "$SAFE_NAME" in
            *.mp4) ;;
            *)
              echo "Invalid output_name: $OUTPUT_NAME"
              exit 1
              ;;
          esac

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build animated reel plan
        id: plan
        env:
          DURATION: ${{ inputs.duration }}
        run: |
          python3 - <<'PY'
          import os

          duration = float(os.environ.get('DURATION', '7') or '7')
          duration = max(5.0, min(15.0, duration))

          intro = 1.0 if duration >= 6 else 0.9

          remaining = max(3.6, duration - intro)
          seg2 = round(remaining * 0.44, 2)
          seg3 = round(remaining * 0.30, 2)
          seg4 = round(max(1.2, duration - intro - seg2 - seg3), 2)

          total = round(intro + seg2 + seg3 + seg4, 2)

          if abs(total - duration) > 0.01:
              seg4 = round(seg4 + (duration - total), 2)

          segs = [round(intro, 2), seg2, seg3, seg4]

          def zoom_expr(start, end, dur):
              frames = max(1, round(max(0.8, dur) * 30))
