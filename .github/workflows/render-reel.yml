name: Render Olechollos Reel

on:
  workflow_dispatch:
    inputs:
      image_path:
        description: Repository image path
        required: true
        type: string
      output_name:
        description: Output MP4 filename
        required: true
        type: string
      duration:
        description: Duration in seconds
        required: true
        default: '7'
        type: string
      style:
        description: discount | price | product
        required: false
        default: 'discount'
        type: string
      music_track:
        description: Music track 0..5
        required: false
        default: '1'
        type: string
      music_volume:
        description: Music volume 0..100
        required: false
        default: '18'
        type: string

permissions:
  contents: write

concurrency:
  group: olechollos-reel-renderer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate input
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          DURATION: ${{ inputs.duration }}
          STYLE: ${{ inputs.style }}
          MUSIC_TRACK: ${{ inputs.music_track }}
          MUSIC_VOLUME: ${{ inputs.music_volume }}
        run: |
          set -euo pipefail

          case "$IMAGE_PATH" in
            inputs/*.png|inputs/*.jpg|inputs/*.jpeg) ;;
            *) exit 1 ;;
          esac

          test -s "$IMAGE_PATH"

          case "$(basename "$OUTPUT_NAME")" in
            *.mp4) ;;
            *) exit 1 ;;
          esac

          case "$STYLE" in
            discount|price|product) ;;
            *) exit 1 ;;
          esac

          python3 - <<'PY'
          import os

          duration = float(os.environ["DURATION"])
          track = int(os.environ["MUSIC_TRACK"])
          volume = int(os.environ["MUSIC_VOLUME"])

          if not 5 <= duration <= 15:
              raise SystemExit("duration fuera de rango")

          if not 0 <= track <= 5:
              raise SystemExit("music_track fuera de rango")

          if not 0 <= volume <= 100:
              raise SystemExit("music_volume fuera de rango")
          PY

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render MP4 with movement and music
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          DURATION: ${{ inputs.duration }}
          STYLE: ${{ inputs.style }}
          MUSIC_TRACK: ${{ inputs.music_track }}
          MUSIC_VOLUME: ${{ inputs.music_volume }}
        run: |
          set -euo pipefail

          mkdir -p renders

          SAFE_NAME="$(basename "$OUTPUT_NAME")"

          read N1 N2 N3 N4 <<< "$(python3 - <<'PY'
          import os

          fps = 30
          duration = max(
              5.0,
              min(
                  15.0,
                  float(os.environ["DURATION"])
              )
          )

          total = int(round(duration * fps))

          n1 = int(round(total * 0.14))
          n2 = int(round(total * 0.34))
          n3 = int(round(total * 0.27))
          n4 = total - n1 - n2 - n3

          print(n1, n2, n3, n4)
          PY
          )"

          echo "Frames: $N1 / $N2 / $N3 / $N4"

          case "$STYLE" in

            discount)
              ZOOM2=0.15
              ZOOM3=0.17
              ZOOM4=0.18

              POS2=0.30
              POS3=0.70
              POS4=0.92
              ;;

            price)
              ZOOM2=0.13
              ZOOM3=0.19
              ZOOM4=0.18

              POS2=0.38
              POS3=0.78
              POS4=0.92
              ;;

            product)
              ZOOM2=0.18
              ZOOM3=0.14
              ZOOM4=0.17

              POS2=0.25
              POS3=0.63
              POS4=0.90
              ;;

          esac

          cat > reel-filter.txt <<EOF

          [0:v]
          scale=1080:1920,
          setsar=1,
          zoompan=
          z='1':
          x='0':
          y='0':
          d=${N1}:
          s=1080x1920:
          fps=30,
          format=yuv420p
          [intro];

          [1:v]
          scale=1080:1920,
          setsar=1,
          zoompan=
          z='1.00+${ZOOM2}*on/${N2}':
          x='iw/2-(iw/zoom/2)':
          y='(ih-ih/zoom)*${POS2}':
          d=${N2}:
          s=1080x1920:
          fps=30,
          format=yuv420p
          [product];

          [2:v]
          scale=1080:1920,
          setsar=1,
          zoompan=
          z='1.03+${ZOOM3}*on/${N3}':
          x='iw/2-(iw/zoom/2)':
          y='(ih-ih/zoom)*${POS3}':
          d=${N3}:
          s=1080x1920:
          fps=30,
          format=yuv420p
          [price];

          [3:v]
          scale=1080:1920,
          setsar=1,
          zoompan=
          z='1.05+${ZOOM4}*on/${N4}':
          x='iw/2-(iw/zoom/2)':
          y='(ih-ih/zoom)*${POS4}':
          d=${N4}:
          s=1080x1920:
          fps=30,
          format=yuv420p
          [cta];

          [intro][product][price][cta]
          concat=n=4:v=1:a=0,
          fps=30,
          format=yuv420p
          [v]

          EOF

          case "$MUSIC_TRACK" in

            0)
              MUSIC_FILE=""
              ;;

            1)
              MUSIC_FILE="assets/music/mixkit-hip-hop-02-738.mp3"
              ;;

            2)
              MUSIC_FILE="assets/music/mixkit-tech-house-vibes-130.mp3"
              ;;

            3)
              MUSIC_FILE="assets/music/mixkit-motivating-mornings-33.mp3"
              ;;

            4)
              MUSIC_FILE="assets/music/mixkit-deep-urban-623.mp3"
              ;;

            5)
              MUSIC_FILE="assets/music/mixkit-raising-me-higher-34.mp3"
              ;;

          esac

          VOL="$(python3 - <<'PY'
          import os

          volume = int(os.environ["MUSIC_VOLUME"])
          volume = max(0, min(100, volume))

          print(volume / 100)
          PY
          )"

          FADE_OUT="$(python3 - <<'PY'
          import os

          duration = float(os.environ["DURATION"])

          print(
              max(
                  0.0,
                  duration - 0.55
              )
          )
          PY
          )"

          if [ -n "$MUSIC_FILE" ]; then

            test -s "$MUSIC_FILE"

            ffmpeg -y \
              -i "$IMAGE_PATH" \
              -i "$IMAGE_PATH" \
              -i "$IMAGE_PATH" \
              -i "$IMAGE_PATH" \
              -stream_loop -1 \
              -i "$MUSIC_FILE" \
              -filter_complex_script reel-filter.txt \
              -map "[v]" \
              -map 4:a \
              -af "volume=${VOL},atrim=0:${DURATION},afade=t=in:st=0:d=0.30,afade=t=out:st=${FADE_OUT}:d=0.55,alimiter=limit=0.90" \
              -t "$DURATION" \
              -r 30 \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -movflags +faststart \
              "renders/$SAFE_NAME"

          else

            ffmpeg -y \
              -i "$IMAGE_PATH" \
              -i "$IMAGE_PATH" \
              -i "$IMAGE_PATH" \
              -i "$IMAGE_PATH" \
              -filter_complex_script reel-filter.txt \
              -map "[v]" \
              -t "$DURATION" \
              -r 30 \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              -an \
              "renders/$SAFE_NAME"

          fi

          rm -f reel-filter.txt

          test -s "renders/$SAFE_NAME"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of default=nw=1 \
            "renders/$SAFE_NAME"

          if [ -n "$MUSIC_FILE" ]; then

            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of default=nw=1 \
              "renders/$SAFE_NAME" \
              | grep -q "codec_name=aac"

          fi

          echo "Reel terminado"
          echo "Estilo: ${STYLE}"
          echo "Música: ${MUSIC_TRACK}"
          echo "Volumen: ${MUSIC_VOLUME}%"
          echo "Movimiento: ACTIVO"

      - name: Publish rendered file
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f "$IMAGE_PATH"

          git add \
            renders/ \
            inputs/ \
            2>/dev/null || true

          git commit \
            -m "Render Olechollos Reel v6.2 · movement + real music" \
            || exit 0

          git pull \
            --rebase \
            origin \
            main

          git push \
            origin \
            HEAD:main
