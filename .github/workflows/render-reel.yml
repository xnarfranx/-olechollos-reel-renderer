name: Render Olechollos Reel

on:
  workflow_dispatch:
    inputs:
      image_path:
        description: Repository image path
        required: true
        type: string
      output_name:
        description: Output MP4 filename
        required: true
        type: string
      duration:
        description: Duration in seconds
        required: true
        default: '7'
        type: string
      style:
        description: discount | price | product
        required: false
        default: 'discount'
        type: string
      music_track:
        description: Music track 0..5 (0 = no music)
        required: false
        default: '1'
        type: string
      music_volume:
        description: Music volume 0..100
        required: false
        default: '18'
        type: string

permissions:
  contents: write

concurrency:
  group: olechollos-reel-renderer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate input
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          DURATION: ${{ inputs.duration }}
          STYLE: ${{ inputs.style }}
          MUSIC_TRACK: ${{ inputs.music_track }}
          MUSIC_VOLUME: ${{ inputs.music_volume }}
        run: |
          set -euo pipefail

          case "$IMAGE_PATH" in
            inputs/*.png|inputs/*.jpg|inputs/*.jpeg) ;;
            *) exit 1 ;;
          esac

          test -s "$IMAGE_PATH"

          case "$(basename "$OUTPUT_NAME")" in
            *.mp4) ;;
            *) exit 1 ;;
          esac

          case "$STYLE" in
            discount|price|product) ;;
            *) exit 1 ;;
          esac

          python3 - <<'PY'
          import os

          d = float(os.environ["DURATION"])
          track = int(os.environ["MUSIC_TRACK"])
          vol = int(os.environ["MUSIC_VOLUME"])

          if not 5 <= d <= 15:
              raise SystemExit("duration fuera de rango")

          if not 0 <= track <= 5:
              raise SystemExit("music_track fuera de rango")

          if not 0 <= vol <= 100:
              raise SystemExit("music_volume fuera de rango")
          PY

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render MP4
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          DURATION: ${{ inputs.duration }}
          STYLE: ${{ inputs.style }}
          MUSIC_TRACK: ${{ inputs.music_track }}
          MUSIC_VOLUME: ${{ inputs.music_volume }}
        run: |
          set -euo pipefail

          mkdir -p renders

          SAFE_NAME="$(basename "$OUTPUT_NAME")"

          read D1 D2 D3 D4 <<< "$(python3 - <<'PY'
          import os

          d = max(
              5.0,
              min(
                  15.0,
                  float(os.environ["DURATION"])
              )
          )

          intro = 1.0 if d >= 6 else 0.9
          rem = max(3.6, d - intro)

          d2 = round(rem * 0.44, 2)
          d3 = round(rem * 0.30, 2)

          d4 = round(
              max(
                  1.2,
                  d - intro - d2 - d3
              ),
              2
          )

          total = intro + d2 + d3 + d4

          if abs(total - d) > 0.01:
              d4 = round(
                  d4 + (d - total),
                  2
              )

          print(
              intro,
              d2,
              d3,
              d4
          )
          PY
          )"

          case "$STYLE" in

            discount)
              Y1=650
              Y2=1250
              Y3=1450
              Z1=1.085
              Z2=1.125
              Z3=1.105
              ;;

            price)
              Y1=900
              Y2=1390
              Y3=1510
              Z1=1.075
              Z2=1.135
              Z3=1.115
              ;;

            product)
              Y1=760
              Y2=980
              Y3=1370
              Z1=1.095
              Z2=1.105
              Z3=1.100
              ;;

          esac

          cat > reel-video-filter.txt <<EOF
          [0:v]scale=1080:1920,setsar=1,format=yuv420p[s0];

          [1:v]scale=1080:1920,
          zoompan=
          z='min(${Z1},zoom+0.00105)':
          x='clip(540-(iw/zoom/2),0,iw-iw/zoom)':
          y='clip(${Y1}-(ih/zoom/2),0,ih-ih/zoom)':
          d=1:
          s=1080x1920:
          fps=30,
          setsar=1,
          format=yuv420p[s1];

          [2:v]scale=1080:1920,
          zoompan=
          z='min(${Z2},zoom+0.00165)':
          x='clip(540-(iw/zoom/2),0,iw-iw/zoom)':
          y='clip(${Y2}-(ih/zoom/2),0,ih-ih/zoom)':
          d=1:
          s=1080x1920:
          fps=30,
          setsar=1,
          format=yuv420p[s2];

          [3:v]scale=1080:1920,
          zoompan=
          z='min(${Z3},zoom+0.00145)':
          x='clip(540-(iw/zoom/2),0,iw-iw/zoom)':
          y='clip(${Y3}-(ih/zoom/2),0,ih-ih/zoom)':
          d=1:
          s=1080x1920:
          fps=30,
          setsar=1,
          format=yuv420p,
          drawbox=
          x=70:
          y=1450:
          w=940:
          h=270:
          color=black@0.12:
          t=fill[s3];

          [s0][s1][s2][s3]
          concat=n=4:v=1:a=0[v]
          EOF

          BASE=(
            ffmpeg -y
            -loop 1 -t "$D1" -i "$IMAGE_PATH"
            -loop 1 -t "$D2" -i "$IMAGE_PATH"
            -loop 1 -t "$D3" -i "$IMAGE_PATH"
            -loop 1 -t "$D4" -i "$IMAGE_PATH"
          )

          case "$MUSIC_TRACK" in
            0)
              MUSIC_FILE=""
              ;;
            1)
              MUSIC_FILE="assets/music/mixkit-hip-hop-02-738.mp3"
              ;;
            2)
              MUSIC_FILE="assets/music/mixkit-tech-house-vibes-130.mp3"
              ;;
            3)
              MUSIC_FILE="assets/music/mixkit-motivating-mornings-33.mp3"
              ;;
            4)
              MUSIC_FILE="assets/music/mixkit-deep-urban-623.mp3"
              ;;
            5)
              MUSIC_FILE="assets/music/mixkit-raising-me-higher-34.mp3"
              ;;
          esac

          if [ -n "$MUSIC_FILE" ]; then

            test -s "$MUSIC_FILE"

            VOL="$(python3 - <<'PY'
          import os

          print(
              max(
                  0,
                  min(
                      100,
                      int(os.environ["MUSIC_VOLUME"])
                  )
              ) / 100
          )
          PY
          )"

            FADE_OUT="$(python3 - <<'PY'
          import os

          d = float(os.environ["DURATION"])

          print(
              max(
                  0.0,
                  d - 0.55
              )
          )
          PY
          )"

            "${BASE[@]}" \
              -stream_loop -1 \
              -i "$MUSIC_FILE" \
              -filter_complex_script reel-video-filter.txt \
              -map "[v]" \
              -map 4:a \
              -af "volume=${VOL},atrim=0:${DURATION},afade=t=in:st=0:d=0.35,afade=t=out:st=${FADE_OUT}:d=0.55,alimiter=limit=0.90" \
              -r 30 \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -movflags +faststart \
              -shortest \
              "renders/$SAFE_NAME"

          else

            "${BASE[@]}" \
              -filter_complex_script reel-video-filter.txt \
              -map "[v]" \
              -r 30 \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -movflags +faststart \
              -an \
              "renders/$SAFE_NAME"

          fi

          rm -f reel-video-filter.txt

          test -s "renders/$SAFE_NAME"

          if [ -n "$MUSIC_FILE" ]; then

            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of default=nw=1 \
              "renders/$SAFE_NAME" \
              | grep -q "codec_name=aac"

          fi

          echo "Reel listo · estilo ${STYLE} · pista ${MUSIC_TRACK} · volumen ${MUSIC_VOLUME}%"

      - name: Publish rendered file
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f "$IMAGE_PATH"

          git add \
            renders/ \
            inputs/ \
            2>/dev/null || true

          git commit \
            -m "Render Olechollos Reel v6.1 · real music" \
            || exit 0

          git pull \
            --rebase \
            origin \
            main

          git push \
            origin \
            HEAD:main
