name: Render Olechollos Reel

on:
  workflow_dispatch:
    inputs:
      image_path:
        required: true
        type: string
      intro_image_path:
        required: true
        type: string
      output_name:
        required: true
        type: string
      duration:
        required: true
        default: '7'
        type: string
      style:
        required: false
        default: 'discount'
        type: string
      music_track:
        required: false
        default: '1'
        type: string
      music_volume:
        required: false
        default: '18'
        type: string

permissions:
  contents: write

concurrency:
  group: olechollos-reel-renderer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Render Reel
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
          INTRO_PATH: ${{ inputs.intro_image_path }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          DURATION: ${{ inputs.duration }}
          STYLE: ${{ inputs.style }}
          MUSIC_TRACK: ${{ inputs.music_track }}
          MUSIC_VOLUME: ${{ inputs.music_volume }}
        run: |
          set -euo pipefail

          test -s "$IMAGE_PATH"
          test -s "$INTRO_PATH"

          mkdir -p renders

          SAFE_NAME="$(basename "$OUTPUT_NAME")"

          read N1 N2 N3 N4 <<< "$(python3 - <<'PY'
          import os

          total = int(
              round(
                  max(
                      5,
                      min(
                          15,
                          float(os.environ["DURATION"])
                      )
                  ) * 30
              )
          )

          n1 = max(
              24,
              int(total * 0.14)
          )

          n2 = int(
              total * 0.34
          )

          n3 = int(
              total * 0.27
          )

          n4 = max(
              1,
              total - n1 - n2 - n3
          )

          print(
              n1,
              n2,
              n3,
              n4
          )
          PY
          )"

          case "$STYLE" in

            discount)
              Z2=0.16
              Z3=0.20
              Z4=0.18

              P2=0.30
              P3=0.78
              P4=0.93
              ;;

            saving)
              Z2=0.14
              Z3=0.22
              Z4=0.18

              P2=0.34
              P3=0.84
              P4=0.93
              ;;

            price)
              Z2=0.13
              Z3=0.21
              Z4=0.18

              P2=0.40
              P3=0.76
              P4=0.93
              ;;

            product)
              Z2=0.20
              Z3=0.15
              Z4=0.17

              P2=0.25
              P3=0.66
              P4=0.91
              ;;

            *)
              Z2=0.16
              Z3=0.20
              Z4=0.18

              P2=0.30
              P3=0.78
              P4=0.93
              ;;

          esac

          cat > /tmp/reel-filter.txt <<EOF
          [0:v]
          scale=1080:1920,
          setsar=1,
          zoompan=
          z='1':
          x='0':
          y='0':
          d=${N1}:
          s=1080x1920:
          fps=30,
          format=yuv420p
          [intro];

          [1:v]
          scale=1080:1920,
          setsar=1,
          zoompan=
          z='1.00+${Z2}*on/${N2}':
          x='iw/2-(iw/zoom/2)':
          y='(ih-ih/zoom)*${P2}':
          d=${N2}:
          s=1080x1920:
          fps=30,
          format=yuv420p
          [product];

          [2:v]
          scale=1080:1920,
          setsar=1,
          zoompan=
          z='1.03+${Z3}*on/${N3}':
          x='iw/2-(iw/zoom/2)':
          y='(ih-ih/zoom)*${P3}':
          d=${N3}:
          s=1080x1920:
          fps=30,
          format=yuv420p
          [metric];

          [3:v]
          scale=1080:1920,
          setsar=1,
          zoompan=
          z='1.05+${Z4}*on/${N4}':
          x='iw/2-(iw/zoom/2)':
          y='(ih-ih/zoom)*${P4}':
          d=${N4}:
          s=1080x1920:
          fps=30,
          format=yuv420p
          [cta];

          [intro]
          [product]
          [metric]
          [cta]
          concat=n=4:v=1:a=0,
          fps=30,
          format=yuv420p
          [v]
          EOF

          case "$MUSIC_TRACK" in

            0)
              MUSIC_FILE=""
              ;;

            1)
              MUSIC_FILE="assets/music/mixkit-hip-hop-02-738.mp3"
              ;;

            2)
              MUSIC_FILE="assets/music/mixkit-tech-house-vibes-130.mp3"
              ;;

            3)
              MUSIC_FILE="assets/music/mixkit-motivating-mornings-33.mp3"
              ;;

            4)
              MUSIC_FILE="assets/music/mixkit-deep-urban-623.mp3"
              ;;

            5)
              MUSIC_FILE="assets/music/mixkit-raising-me-higher-34.mp3"
              ;;

          esac

          VOL="$(python3 - <<'PY'
          import os

          print(
              max(
                  0,
                  min(
                      100,
                      int(os.environ["MUSIC_VOLUME"])
                  )
              ) / 100
          )
          PY
          )"

          FADE_OUT="$(python3 - <<'PY'
          import os

          print(
              max(
                  0,
                  float(os.environ["DURATION"]) - 0.55
              )
          )
          PY
          )"

          if [ -n "$MUSIC_FILE" ]; then

            ffmpeg -y \
              -i "$INTRO_PATH" \
              -i "$IMAGE_PATH" \
              -i "$IMAGE_PATH" \
              -i "$IMAGE_PATH" \
              -stream_loop -1 \
              -i "$MUSIC_FILE" \
              -filter_complex_script /tmp/reel-filter.txt \
              -map "[v]" \
              -map 4:a \
              -af "volume=${VOL},atrim=0:${DURATION},afade=t=in:st=0:d=0.30,afade=t=out:st=${FADE_OUT}:d=0.55,alimiter=limit=0.90" \
              -t "$DURATION" \
              -r 30 \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -movflags +faststart \
              "renders/$SAFE_NAME"

          else

            ffmpeg -y \
              -i "$INTRO_PATH" \
              -i "$IMAGE_PATH" \
              -i "$IMAGE_PATH" \
              -i "$IMAGE_PATH" \
              -filter_complex_script /tmp/reel-filter.txt \
              -map "[v]" \
              -t "$DURATION" \
              -r 30 \
              -c:v libx264 \
              -preset veryfast \
              -crf 20 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              -an \
              "renders/$SAFE_NAME"

          fi

          test -s "renders/$SAFE_NAME"

      - name: Publish rendered file
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
          INTRO_PATH: ${{ inputs.intro_image_path }}
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f \
            "$IMAGE_PATH" \
            "$INTRO_PATH"

          git add \
            renders/ \
            inputs/ \
            2>/dev/null || true

          git commit \
            -m "Render Olechollos Reel v6.5 · baked hook + movement + music" \
            || exit 0

          git pull \
            --rebase \
            origin \
            main

          git push \
            origin \
            HEAD:main
