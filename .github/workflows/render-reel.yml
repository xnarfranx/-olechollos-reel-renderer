name: Render Olechollos Reel

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: Public URL of the Olechollos story image
        required: true
        type: string
      output_name:
        description: Output MP4 filename
        required: true
        type: string
      duration:
        description: Duration in seconds
        required: true
        default: '7'
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          curl --fail --location --retry 3 --output story.jpg "$IMAGE_URL"
          test -s story.jpg

      - name: Render MP4
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
          DURATION: ${{ inputs.duration }}
        run: |
          mkdir -p renders
          SAFE_NAME="$(basename "$OUTPUT_NAME")"
          ffmpeg -y -loop 1 -i story.jpg \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -r 30 -c:v libx264 -preset veryfast -pix_fmt yuv420p -movflags +faststart -an \
            "renders/$SAFE_NAME"
          test -s "renders/$SAFE_NAME"

      - name: Keep latest renders
        run: |
          ls renders/*.mp4 2>/dev/null | sort -r | tail -n +31 | xargs -r rm -f

      - name: Publish rendered file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renders/
          git commit -m "Render Olechollos Reel" || exit 0
          git push
